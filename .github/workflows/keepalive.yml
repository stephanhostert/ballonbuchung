name: Supabase Keepalive

on:
  schedule:
    - cron: '23 5 */2 * *'     # alle 2 Tage um 05:23 UTC
  workflow_dispatch:           # zusaetzlich manuell startbar (Tab "Actions")

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (rpc/ping)
        run: |
          curl -sS -X POST \
            'https://jorngnkbyvxkntvaadcw.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_R7dJv2fCtG8ud3dDCaeqUQ_9BfG52EI' \
            -H 'Authorization: Bearer sb_publishable_R7dJv2fCtG8ud3dDCaeqUQ_9BfG52EI' \
            -H 'Content-Type: application/json' \
            -d '{}' \
            -w '\nHTTP %{http_code}\n'
